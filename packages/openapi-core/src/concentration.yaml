openapi: 3.1.0
info:
  title: Ordovex Concentration API
  version: 0.1.0
  description: Crowded-signal concentration by factor / signal family (BR-9).
  x-domain: cnc
  license:
    name: Proprietary
servers:
  - url: https://api.ordovex.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Concentration
paths:
  /v1/concentration:
    get:
      operationId: getConcentrationSnapshot
      tags: [Concentration]
      x-repository: ConcentrationSnapshot
      x-dynamodb:
        entityType: CONCENTRATION_SNAPSHOT
        pkPatternTemplate: "CONC#LATEST"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      responses:
        '200':
          description: Concentration matrix
          content:
            application/json:
              schema:
                $ref: ./concentration.schemas.yaml#/components/schemas/ConcentrationSnapshotResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/concentration/alerts:
    get:
      operationId: listConcentrationAlerts
      tags: [Concentration]
      x-repository: ConcentrationAlert
      x-dynamodb:
        entityType: CONCENTRATION_ALERT
        pkPatternTemplate: "CONCALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        filterFields: [status, deskId]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                $ref: ./concentration.schemas.yaml#/components/schemas/ConcentrationAlertListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createConcentrationAlert
      tags: [Concentration]
      x-repository: ConcentrationAlert
      x-dynamodb:
        entityType: CONCENTRATION_ALERT
        pkPatternTemplate: "CONCALERT#${alertId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./concentration.schemas.yaml#/components/schemas/ConcentrationAlertCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./concentration.schemas.yaml#/components/schemas/ConcentrationAlertResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
