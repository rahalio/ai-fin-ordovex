openapi: 3.1.0
info:
  title: Ordovex PreTrade API
  version: 0.1.0
  description: Pre-trade order intent checks against certified envelopes (BR-1, BR-11).
  x-domain: prt
  license:
    name: Proprietary
servers:
  - url: https://api.ordovex.local
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: PreTrade
paths:
  /v1/pretrade/checks:
    post:
      operationId: checkOrderIntent
      tags: [PreTrade]
      security:
        - apiKey: []
      x-repository: OrderIntentCheck
      x-dynamodb:
        entityType: ORDER_INTENT_CHECK
        pkPatternTemplate: "PRETRADE#${orderIntentCheckId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./pretrade.schemas.yaml#/components/schemas/OrderIntentCheckRequest
      responses:
        '201':
          description: Check result
          content:
            application/json:
              schema:
                $ref: ./pretrade.schemas.yaml#/components/schemas/OrderIntentCheckResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    get:
      operationId: listOrderIntentChecks
      tags: [PreTrade]
      x-repository: OrderIntentCheck
      x-dynamodb:
        entityType: ORDER_INTENT_CHECK
        pkPatternTemplate: "PRETRADE#${orderIntentCheckId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        filterFields: [strategyId, result]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: strategyId
          in: query
          schema:
            $ref: ./pretrade.schemas.yaml#/components/schemas/StrategyId
        - name: result
          in: query
          schema:
            $ref: ./pretrade.schemas.yaml#/components/schemas/CheckResult
      responses:
        '200':
          description: Checks
          content:
            application/json:
              schema:
                $ref: ./pretrade.schemas.yaml#/components/schemas/OrderIntentCheckListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/pretrade/checks/{orderIntentCheckId}:
    get:
      operationId: getOrderIntentCheck
      tags: [PreTrade]
      x-repository: OrderIntentCheck
      x-dynamodb:
        entityType: ORDER_INTENT_CHECK
        pkPatternTemplate: "PRETRADE#${orderIntentCheckId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: orderIntentCheckId
          in: path
          required: true
          schema:
            $ref: ./pretrade.schemas.yaml#/components/schemas/OrderIntentCheckId
      responses:
        '200':
          description: Check
          content:
            application/json:
              schema:
                $ref: ./pretrade.schemas.yaml#/components/schemas/OrderIntentCheckResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
