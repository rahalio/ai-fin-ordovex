openapi: 3.0.3
info:
  title: Ordovex
  version: 0.1.0
  description: Pre-trade and intraday risk-control plane for algorithmic and ai-assisted trading desks.
  x-product-slug: ai-fin-ordovex
  x-source: ai-in-financial/Artificial-Intelligence-Financial-Sector/
servers:
- url: https://api.example.com
tags:
- name: Strategies
  description: Strategy registry
- name: Certifications
  description: Strategy certification
- name: Limits
  description: Hierarchical limit packages
- name: PreTrade
  description: Pre-trade order intent checks
- name: Telemetry
  description: Intraday telemetry
- name: Kills
  description: Kill-switch orchestration
- name: Incidents
  description: Incident reconstruction packs
paths:
  /v1/strategies:
    get:
      operationId: listTradingStrategies
      tags:
      - Strategies
      security: &id001
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeStrategy'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTradingStrategy
      tags:
      - Strategies
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeStrategy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/strategies/{strategyId}:
    parameters:
    - $ref: '#/components/parameters/StrategyId'
    get:
      operationId: getTradingStrategy
      tags:
      - Strategies
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeStrategy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/certifications:
    get:
      operationId: listCertifications
      tags:
      - Certifications
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeCertification'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: submitCertification
      tags:
      - Certifications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeCertification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/limits:
    get:
      operationId: listLimitPackages
      tags:
      - Limits
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeLimitPackage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: upsertLimitPackage
      tags:
      - Limits
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitPackageUpsert'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeLimitPackage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/pretrade/checks:
    post:
      operationId: checkOrderIntent
      tags:
      - PreTrade
      security: &id002
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIntentCheckRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeOrderIntentCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/telemetry:
    post:
      operationId: ingestTelemetry
      tags:
      - Telemetry
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetrySnapshotCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeTelemetrySnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/kills:
    get:
      operationId: listKillOrders
      tags:
      - Kills
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeKillOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: issueKillOrder
      tags:
      - Kills
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillOrderCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeKillOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/incidents/packs:
    post:
      operationId: createIncidentPack
      tags:
      - Incidents
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - strategyId
              properties:
                strategyId:
                  type: string
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeIncidentPack'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Strategy:
      type: object
      required:
      - id
      - name
      - deskId
      - kind
      - status
      properties:
        id:
          type: string
        name:
          type: string
        deskId:
          type: string
        markets:
          type: array
          items:
            type: string
        kind:
          type: string
          enum:
          - ai_overlay
          - market_making
          - execution_algo
        status:
          type: string
          enum:
          - draft
          - certified
          - killed
    StrategyCreate:
      type: object
      required:
      - name
      - deskId
      - kind
      properties:
        name:
          type: string
        deskId:
          type: string
        markets:
          type: array
          items:
            type: string
        kind:
          type: string
          enum:
          - ai_overlay
          - market_making
          - execution_algo
    Certification:
      type: object
      required:
      - id
      - strategyId
      - status
      properties:
        id:
          type: string
        strategyId:
          type: string
        modelVersionId:
          type: string
        evidenceStatus:
          type: string
          enum:
          - pending
          - accepted
          - rejected
        approvedBy:
          type: string
        status:
          type: string
          enum:
          - pending
          - certified
          - rejected
    CertificationCreate:
      type: object
      required:
      - strategyId
      - modelVersionId
      properties:
        strategyId:
          type: string
        modelVersionId:
          type: string
        evidenceUri:
          type: string
          format: uri
    LimitPackage:
      type: object
      required:
      - id
      - strategyId
      - maxLoss
      - hierarchyLevel
      properties:
        id:
          type: string
        strategyId:
          type: string
        maxLoss:
          type: number
        maxMessageRate:
          type: integer
        inventorySkewLimit:
          type: number
        hierarchyLevel:
          type: string
          enum:
          - firm
          - desk
          - strategy
          - symbol
    LimitPackageUpsert:
      type: object
      required:
      - strategyId
      - maxLoss
      - hierarchyLevel
      properties:
        strategyId:
          type: string
        maxLoss:
          type: number
        maxMessageRate:
          type: integer
        inventorySkewLimit:
          type: number
        hierarchyLevel:
          type: string
          enum:
          - firm
          - desk
          - strategy
          - symbol
        symbol:
          type: string
    OrderIntentCheck:
      type: object
      required:
      - id
      - strategyId
      - result
      properties:
        id:
          type: string
        strategyId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        qty:
          type: number
        result:
          type: string
          enum:
          - allow
          - reject
        reasons:
          type: array
          items:
            type: string
    OrderIntentCheckRequest:
      type: object
      required:
      - strategyId
      - symbol
      - side
      - qty
      properties:
        strategyId:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        qty:
          type: number
        price:
          type: number
    TelemetrySnapshot:
      type: object
      required:
      - id
      - strategyId
      - observedAt
      properties:
        id:
          type: string
        strategyId:
          type: string
        pnl:
          type: number
        drawdown:
          type: number
        messageRate:
          type: integer
        observedAt:
          type: string
          format: date-time
    TelemetrySnapshotCreate:
      type: object
      required:
      - strategyId
      - pnl
      - drawdown
      - messageRate
      properties:
        strategyId:
          type: string
        pnl:
          type: number
        drawdown:
          type: number
        messageRate:
          type: integer
    KillOrder:
      type: object
      required:
      - id
      - scope
      - targetId
      - status
      properties:
        id:
          type: string
        scope:
          type: string
          enum:
          - strategy
          - desk
          - firm
        targetId:
          type: string
        cancelWorking:
          type: boolean
        reason:
          type: string
        status:
          type: string
          enum:
          - issued
          - completed
    KillOrderCreate:
      type: object
      required:
      - scope
      - targetId
      - reason
      properties:
        scope:
          type: string
          enum:
          - strategy
          - desk
          - firm
        targetId:
          type: string
        cancelWorking:
          type: boolean
        reason:
          type: string
    IncidentPack:
      type: object
      required:
      - id
      - strategyId
      properties:
        id:
          type: string
        strategyId:
          type: string
        downloadUrl:
          type: string
          format: uri
    DataEnvelopeStrategy:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Strategy'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeStrategy:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Strategy'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeCertification:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Certification'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeCertification:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Certification'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeLimitPackage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/LimitPackage'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeLimitPackage:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LimitPackage'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeOrderIntentCheck:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/OrderIntentCheck'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeOrderIntentCheck:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderIntentCheck'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeTelemetrySnapshot:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/TelemetrySnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeTelemetrySnapshot:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TelemetrySnapshot'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeKillOrder:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/KillOrder'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeKillOrder:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/KillOrder'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeIncidentPack:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/IncidentPack'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeIncidentPack:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IncidentPack'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
